name: Shared console core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  console:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Config preservation, process ownership and local HTTP isolation
        working-directory: mac/console
        run: python -m unittest discover -s tests -p 'test_*.py' -v
