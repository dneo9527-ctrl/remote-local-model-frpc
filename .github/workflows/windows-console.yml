name: Windows native model console
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-console:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build WPF and run isolated PowerShell 5.1 checks
        shell: powershell
        run: .\tests\windows\Verify-Console.ps1 -OutputDirectory "$env:RUNNER_TEMP\windows-console-evidence"
      - name: Keep native checks and labelled offline WPF preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-console-${{ github.sha }}
          path: ${{ runner.temp }}/windows-console-evidence
          if-no-files-found: error
          retention-days: 14
