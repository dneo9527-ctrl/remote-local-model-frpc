<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网页聊天 · 本地 AI</title><link rel="stylesheet" href="/style.css"><script src="/chat.js" defer></script></head>
<body class="chat-home">
<header><div class="chat-header"><div><div class="brand">LOCAL AI / WEB CHAT</div><h1>网页聊天</h1></div><a href="/" class="secondary">返回控制台</a></div></header>
<main class="chat-shell">
  <div class="chat-toolbar"><label for="model">模型</label><select id="model" disabled><option value="">读取模型中…</option></select><button class="secondary" id="reload" disabled>刷新模型</button><button class="text-button" id="remember-model" disabled>设为默认</button><button class="secondary" id="new-chat" disabled>新对话</button></div>
  <div class="model-status" id="model-status">正在读取模型列表…</div>
  <section class="chat-box" id="messages" aria-label="聊天记录" aria-live="polite"><p class="muted" id="empty">选择模型，发送第一条消息。聊天与草稿留在当前窗口内存中。</p></section>
  <form id="form"><textarea id="input" placeholder="输入消息，点击发送" aria-label="聊天消息" maxlength="16000" required></textarea><div class="chat-send-actions"><span class="chat-model-default" id="model-default">默认模型尚未读取</span><button class="secondary" id="stop" type="button" disabled>停止回答</button><button class="primary" id="send" type="submit" disabled>发送</button></div></form>
  <div class="message" id="message" role="status" aria-live="polite">正在读取模型列表…</div>
  <details class="chat-help"><summary>会话与连接说明</summary><p>保留最近 12 条消息，长文本仍可能超出模型窗口。切换模型会开始新对话并保留未发送草稿；停止或断线不会自动重发。默认模型只影响本机网页聊天，不改变 CC Switch 或 Windows 设置。本页暂不含附件、自动压缩和知识库。</p></details>
</main>
</body></html>
